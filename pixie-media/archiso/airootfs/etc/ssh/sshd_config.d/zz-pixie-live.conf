# pixie live env: allow root password login so an operator can ssh in
# for diagnosis when the local console is unavailable or unusable.
# Layered after archiso's own 10-archiso.conf drop-in. The live env is
# ephemeral and lab-trust (root password = ``pixie``, set in
# /etc/shadow), matching the pixie appliance's model; sshd regenerates
# fresh host keys on first boot (archiso ships none in the airootfs).
PermitRootLogin yes
PasswordAuthentication yes
