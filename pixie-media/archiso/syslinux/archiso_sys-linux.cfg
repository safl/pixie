LABEL arch
TEXT HELP
Boot the pixie live env on BIOS (flash / inventory / operator TUI).
ENDTEXT
MENU LABEL pixie __PIXIE_VERSION__ live env (BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=tty0 console=ttyS0,115200 modprobe.blacklist=nouveau,rndis_host nouveau.modeset=0 systemd.gpt_auto=0 pixie.version=__PIXIE_VERSION__
