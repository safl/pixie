# pixie netboot-pc live env: bake a BROAD, host-AGNOSTIC dracut initrd.
#
# History: the live env used to build its initrd with initramfs-tools +
# Debian live-boot, driven off the ``fetch=`` kernel-cmdline handler.
# That path hung in the initramfs on some hardware (a dual-NIC Intel
# igb box: live-boot's ipconfig returned with no NIC configured, so the
# squashfs never fetched and the box sat at ``initrd`` forever) even
# though the SAME box nbdboots fine under dracut in ~24s. dracut's
# network stack (dmsquash-live + livenet + network) works where
# live-boot's did not, so the netboot-pc bake now generates its initrd
# with dracut (``lb config --initramfs dracut-live`` in ``auto/config``)
# and this drop-in configures it. See CHANGELOG 0.4.x.
#
# hostonly="no": build a GENERIC initrd, not one trimmed to the CI build
# host's NIC + storage. This is the dracut analogue of the old
# ``MODULES=most`` knob. dracut's default host-only mode would bake only
# the drivers the BUILDER needs; a PXE-booted target with a different
# NIC would then come up to ``initrd`` and stall at the squashfs fetch
# with a dark NIC. The netboot-pc initrd's entire job is to drive an
# ARBITRARY target's NIC (and storage) before pivot-root, so we take the
# broad in-tree driver set and the initramfs-size cost that comes with
# it. Same rationale the replaced ``pixie-modules-most`` file carried.
#
# add_dracutmodules: force the live-fetch chain into EVERY generated
# initrd regardless of the build host's cmdline (there is no cmdline at
# bake time, so dracut can't infer these from ``root=``):
#
#   * dmsquash-live -- loop-mounts the fetched squashfs read-only and
#     stacks a tmpfs overlay for the ephemeral rootfs. Activated at boot
#     by ``root=live:<url>``, rendered per-client by the server's
#     ``ipxe/pixie-live-env.j2`` template. (usbboot-pc does NOT use
#     dracut -- it stays on live-boot; this drop-in only affects the
#     netboot-pc chroot, where dracut is the initrd generator. It is
#     inert in the usbboot chroot, which has no dracut installed.)
#   * livenet -- the HTTP(S) fetcher dmsquash-live calls when the
#     ``root=live:`` source is a URL. This is the direct replacement for
#     live-boot's ``fetch=`` handler.
#   * network -- brings the primary NIC up via DHCP in the initrd
#     (driven by ``ip=dhcp rd.neednet=1`` on the netboot cmdline) so
#     livenet has a route before it reaches out for the squashfs. On
#     Debian trixie the generic ``network`` module resolves to a
#     concrete provider; if a future dracut drops the wrapper, switch to
#     ``network-legacy`` or ``network-manager`` (Fedora-style split).
hostonly="no"
add_dracutmodules+=" dmsquash-live livenet network "

# Force the out-of-tree r8125 2.5GbE driver into the initrd. It is DKMS-
# built by ``hooks/normal/0600-pixie-r8125-dkms.hook.chroot`` and lands
# under ``/lib/modules/<ver>/updates/dkms/``; hostonly="no" pulls the
# broad IN-tree driver set but does not reliably sweep in out-of-tree
# DKMS modules, and the r8125 boxes (GMKTec NUCBOX G10 et al.) need this
# driver alive before the squashfs fetch just like any other NIC.
# ``add_drivers`` names are matched loosely by dracut and a missing
# module is skipped without error, so this is safe on a build where the
# DKMS step was skipped (non-amd64).
add_drivers+=" r8125 "
