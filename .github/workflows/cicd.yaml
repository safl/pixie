name: cicd

# Jobs:
#   * ``test``: fast unit tests on the Python matrix.
#   * ``integration``: builds the container, starts it under podman,
#     runs ``pytest -m integration`` against the running container
#     (real nbdkit, real HTTP, real NBD wire).
#   * ``build-container``: separate smoke build kept for the "does
#     the Containerfile parse on a fresh runner" signal.
#   * ``build-media``: build the usbboot-pc bootable .iso via the cijoe
#     live-build pipeline under cijoe/tasks/. Requires live-build +
#     passwordless sudo; the runner has both.
#   * ``verify-usbboot``: structurally verify the usbboot-pc .iso
#     (hybrid ISO + El Torito BIOS & UEFI entries + sha256), then boot
#     it via a real Ventoy stick in QEMU and assert the pixie live env
#     comes up. Gates the publish jobs so a broken / non-Ventoy .iso
#     never ships.
#   * ``build-wheel``: sdist + wheel for PyPI. Runs on every push +
#     PR so the packaging story is exercised regardless of tag state.
#   * ``publish-pypi``: trusted publishing of the wheel + sdist,
#     fires ONLY on ``v*`` tag pushes. PyPI is for life -- a published
#     version cannot be re-uploaded -- so the job gates on every
#     prior job (test + integration + build-container + build-wheel
#     + build-media + every PXE chain test) succeeding first.
#   * ``publish-container``: build + push the appliance image to
#     ghcr.io/<owner>/pixie (``:<version>`` + ``:latest``), v* tags
#     only. Before this the image was smoke-built and thrown away, so
#     the documented ghcr image was never populated by CI.
#   * ``publish-release``: create the GitHub Release for the tag and
#     attach the media -- the pixie-live-env nbdboot image + the
#     usbboot-pc bootable .iso + checksums. These used to live only as
#     ephemeral, login-gated workflow artifacts.
#
# First publish (claiming the pixie-lab name) requires a one-time
# PyPI setup: register a Pending Publisher on https://pypi.org
# targeting:
#   PyPI Project Name:  pixie-lab
#   Owner:              safl
#   Repository:         pixie
#   Workflow filename:  cicd.yaml
#   Environment name:   pypi
# Then push a ``v*`` tag (e.g. ``v0.1.0``) and publish-pypi claims
# and uploads the release.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (lint + typecheck + pytest ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7.2.1
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - name: pytest + coverage
        # ``--cov-fail-under`` is a regression FLOOR, not a target: it
        # fails the build if coverage drops below the line, so a PR that
        # removes tests or adds a big untested surface is caught. Ratchet
        # it up as coverage improves. term-missing prints the uncovered
        # lines in the job log; coverage.xml is uploaded for tooling.
        run: >
          uv run pytest -v
          --cov=src/pixie --cov-report=term-missing --cov-report=xml
          --cov-fail-under=55
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

  integration:
    name: Integration (real container + real nbdkit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/podman-registry-mirror
      - uses: astral-sh/setup-uv@v7.2.1
        with:
          python-version: "3.13"
      - name: Install podman
        run: |
          # GHA ubuntu-latest already ships podman; a version check
          # documents what we got and fails loud if podman disappears
          # from the runner image later.
          podman --version
      - name: Install flash-test tooling
        # The loop-device flash tests drive real images through every
        # supported format. zstd/xz/bzip2 ship on the runner; qemu-img
        # (qcow2 convert) does not, so install it -- without it the
        # qcow2 flash paths silently skip and go uncovered.
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils
      - run: uv sync --all-extras --group dev
      # The integration suite's ``container`` fixture builds
      # ``pixie:integration-test`` on demand, but running the build
      # explicitly here surfaces build failures as their own step
      # rather than buried in a pytest skip.
      - name: Build pixie container
        run: podman build -t pixie:integration-test -f Containerfile .
      # Coverage is tracked here too: the loop-device flash tests
      # (tests/integration/test_flash.py) exercise flash.py's destructive
      # write path IN-PROCESS, so pytest-cov measures it -- unlike the
      # container-based tests, whose code runs in the container and can't
      # be instrumented. This is where flash.py (the low anchor in the
      # unit run) actually gets covered. GHA runners have passwordless
      # sudo + losetup; the tests skip cleanly if a runner ever lacks them.
      - name: Run integration tests
        run: >
          uv run pytest -v -m integration -o addopts=
          --cov=src/pixie --cov-report=term-missing --cov-report=xml
      - name: Upload integration coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-integration
          path: coverage.xml
          if-no-files-found: warn

  build-container:
    name: Build container (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/podman-registry-mirror
      - run: podman build -t pixie:ci -f Containerfile .

  build-media:
    name: Build ${{ matrix.variant }} image
    needs: test
    runs-on: ubuntu-latest
    # A cold mkarchiso (usbboot-pc .iso) finishes in 25-40 min on a
    # warm GHA runner (pacstrap pulls ~1.3 GB incl. full linux-firmware,
    # then xz-squashfs the rootfs). The dominant slow path is the
    # package pull, so a 60 min cap fails a stuck build fast; the
    # cijoe-output artifact uploaded below (if: always()) carries the
    # captured console + report.html for the post-mortem.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [usbboot-pc]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/podman-registry-mirror

      - name: Install build dependencies
        # The pixie usbboot .iso is built by mkarchiso inside a
        # privileged archlinux container (archiso_build.py launches it;
        # docker is preinstalled on ubuntu-latest and runs as root, so
        # ``docker run --privileged`` works). The host itself only needs
        # exfatprogs for the trailing PIXIE_IMGS exFAT partition append
        # -- sfdisk / losetup / blkid come from util-linux, already
        # present on the runner.
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends exfatprogs
          docker --version

      - name: Install cijoe
        run: pipx install --force cijoe

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Build image
        run: make build VARIANT=${{ matrix.variant }}

      # cijoe captures the full run (per-command output incl. the
      # in-chroot log + a rendered report.html) under
      # cijoe/cijoe-output/. Upload it ALWAYS; on a hang/timeout
      # this is the only window into what the bake was stuck on.
      - name: Upload cijoe output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cijoe-output-${{ matrix.variant }}
          path: cijoe/cijoe-output
          if-no-files-found: warn

      - name: Upload artifact (usbboot-pc)
        if: matrix.variant == 'usbboot-pc'
        uses: actions/upload-artifact@v7
        with:
          name: pixie-usbboot-pc-x86_64
          path: |
            ~/system_imaging/disk/pixie-usbboot-pc-x86_64-v*.iso
            ~/system_imaging/disk/pixie-usbboot-pc-x86_64-v*.sha256

  build-live-env-image:
    name: Build pixie-live-env image
    # The image the live-env boot modes nbdboot: the nosi arch-headless
    # base disk image with the pixie CLI + pixie-on-tty1 service injected
    # (cijoe/tasks/live-env-image.yaml). Unlike the live-build bakes this
    # does NOT run debootstrap/mksquashfs; it qemu-nbd-mounts a copy of a
    # pulled base image, injects userspace, slims, and gzips. Wired to
    # ``test`` so we don't pay for the ORAS pull + qemu transform on a
    # broken lint/typecheck.
    needs: test
    runs-on: ubuntu-latest
    # 60 min cap for the same reason as build-media: the real ORAS pull
    # of the arch-headless base (~1.6 GiB) + decompress + qemu transform
    # + gzip dominate wall clock.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies (qemu-nbd, rsync, nbd module)
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-utils rsync gzip
          # The transform attaches a copy of the base image to /dev/nbdX
          # via qemu-nbd; load the module with partition scanning so the
          # root partition shows up as nbdXp1.
          sudo modprobe nbd max_part=16
          ls -la /dev/nbd0

      - name: Install cijoe
        run: pipx install --force cijoe

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Build pixie-live-env image
        run: make live-env-image

      # cijoe captures the full run (per-command output + report.html)
      # under cijoe/cijoe-output/. Upload it ALWAYS so a transform
      # failure leaves a diagnosable artifact.
      - name: Upload cijoe output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cijoe-output-live-env-image
          path: cijoe/cijoe-output
          if-no-files-found: warn

      - name: Upload artifact (pixie-live-env-image)
        uses: actions/upload-artifact@v7
        with:
          name: pixie-live-env-image-x86_64
          path: |
            ~/system_imaging/disk/pixie-live-env-x86_64.img.gz
            ~/system_imaging/disk/pixie-live-env-x86_64.img.gz.sha256
            ~/system_imaging/disk/pixie-live-env-x86_64.content-sha256
            ~/system_imaging/disk/pixie-live-env-catalog.toml
          if-no-files-found: error

  test-pxe:
    name: PXE bootstrap chain test (containerized pixie + client QEMU VM)
    # Independent of the media bake: the chain test only needs the
    # container to serve /pxe-bootstrap.ipxe + /pxe/<mac>. Wire it to
    # ``test`` so we don't pay for QEMU on a broken lint/typecheck.
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/podman-registry-mirror

      - name: Install host tools (qemu, dnsmasq, ipxe, bridge)
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            qemu-utils \
            dnsmasq \
            ipxe \
            bridge-utils \
            iproute2
          # /dev/kvm is crw-rw---- root:kvm on the runner but the
          # runner user is not in the kvm group, so QEMU -enable-kvm
          # fails "Permission denied". Widen the ACL rather than
          # mess with group membership (which needs a fresh login
          # to take effect).
          sudo chmod a+rw /dev/kvm
          ls -la /dev/kvm

      - name: Install cijoe
        run: pipx install --force cijoe

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Run PXE bootstrap chain test
        run: make test-pxe

      # cijoe writes the full run (per-command output + report.html)
      # under cijoe/cijoe-output/; upload it ALWAYS so a hang / marker
      # miss leaves a diagnosable artifact.
      - name: Upload cijoe output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cijoe-output-test-pxe
          path: cijoe/cijoe-output
          if-no-files-found: warn

      - name: Upload PXE workspace (serial logs, dnsmasq.log)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-pxe-workspace
          path: cijoe/_build/test-pxe
          if-no-files-found: warn

  test-pxe-nbdboot:
    name: PXE nbdboot chain test (containerized pixie + client QEMU VM)
    # No build-media dependency: this test no longer uses pixie's own
    # netboot-pc bake. It fetches a real nosi netboot bundle + disk
    # image via oras from ghcr.io -- kernel/initrd from nosi's
    # netboot bundle, root disk from nosi's img.gz -- and asserts a
    # real Debian userspace comes up over NBD.
    #
    # 60 min timeout because the real oras pull (~2.6 GiB compressed) +
    # img.gz decompression to pixie's blob store dominates wall clock.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/podman-registry-mirror

      - name: Install host tools (qemu, dnsmasq, ipxe, bridge)
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            qemu-utils \
            dnsmasq \
            ipxe \
            bridge-utils \
            iproute2
          sudo chmod a+rw /dev/kvm
          ls -la /dev/kvm

      - name: Install cijoe
        run: pipx install --force cijoe

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Run PXE nbdboot chain test
        run: make test-pxe-nbdboot

      - name: Upload cijoe output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cijoe-output-test-pxe-nbdboot
          path: cijoe/cijoe-output
          if-no-files-found: warn

      - name: Upload PXE workspace (serial logs, dnsmasq.log)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-pxe-nbdboot-workspace
          path: cijoe/_build/test-pxe
          if-no-files-found: warn

  test-pxe-live-env-modes:
    name: PXE live-env modes chain test (containerized pixie + client QEMU VM)
    # Consolidated: nbdboots the pixie-live-env image ONCE, then runs
    # pixie-inventory / -tui / -flash-once against it in sequence (one
    # heavy image fetch, three client boots, destructive flash last).
    # Fetches the pinned pixie-live-env release image (https) + its
    # arch-headless netboot bundle (oras) + the nosi flash target
    # (oras). No build-media dependency.
    #
    # 90 min: the pixie-live-env img.gz fetch + the flash submode's
    # ~2.6 GiB nosi image pull/decompress + three sequential QEMU boots
    # dominate wall clock.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/podman-registry-mirror

      - name: Install host tools (qemu, dnsmasq, ipxe, bridge)
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            qemu-utils \
            dnsmasq \
            ipxe \
            bridge-utils \
            iproute2
          sudo chmod a+rw /dev/kvm
          ls -la /dev/kvm

      - name: Install cijoe
        run: pipx install --force cijoe

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Run PXE live-env modes chain test
        run: make test-pxe-live-env-modes

      - name: Upload cijoe output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cijoe-output-test-pxe-live-env-modes
          path: cijoe/cijoe-output
          if-no-files-found: warn

      - name: Upload PXE workspace (serial logs, dnsmasq.log)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-pxe-live-env-modes-workspace
          path: cijoe/_build/test-pxe
          if-no-files-found: warn

  verify-usbboot:
    name: Verify usbboot .iso (structural + Ventoy boot in QEMU)
    # Downloads the usbboot-pc bake, structurally verifies the hybrid
    # ISO (ISO 9660 + isohybrid MBR + El Torito BIOS & UEFI entries +
    # sha256), then boots it via a real Ventoy stick in QEMU and asserts
    # the pixie live env comes up: pixie-usb-grow skips (no PIXIE_IMGS
    # under a loop-mounted ISO), pixie-images-discover bind-mounts the
    # operator drop, pixie-on-tty1 renders the CLI wizard. Gates the
    # release -- a broken / non-bootable / non-Ventoy-compatible ISO
    # must not ship.
    needs: build-media
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Install host tools (qemu, ovmf, exfat, xorriso)
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            qemu-utils \
            ovmf \
            exfat-fuse \
            exfatprogs \
            xorriso \
            file
          sudo chmod a+rw /dev/kvm
          ls -la /dev/kvm

      - name: Install cijoe
        run: pipx install --force cijoe

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Download usbboot-pc artifact
        uses: actions/download-artifact@v7
        with:
          name: pixie-usbboot-pc-x86_64
          path: ~/system_imaging/disk/

      - name: Show downloaded artifact contents
        run: |
          set -eu
          echo "--- ~/system_imaging/disk (recursive) ---"
          find ~/system_imaging/disk -maxdepth 5 -print

      - name: Verify + Ventoy-boot the usbboot .iso
        run: make test-usb-ventoy

      - name: Upload cijoe output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cijoe-output-test-usb-ventoy
          path: cijoe/cijoe-output
          if-no-files-found: warn

  build-wheel:
    name: Build wheel + sdist
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
      - run: uv build
      - name: Verify the wheel ships the console-script modules
        # A bad sdist exclude once dropped src/pixie/deploy and -- since
        # ``uv build`` builds the wheel from the sdist -- shipped a wheel
        # with no ``pixie-lab`` CLI (broken on PyPI in 0.4.7-0.4.9).
        # Install the freshly built wheel into a throwaway env and run
        # BOTH console scripts so a missing entry-point module fails CI
        # here, not on a user's ``uv tool run pixie-lab``.
        run: |
          set -eu
          WHL=$(ls dist/*.whl | head -1)
          uvx --from "$WHL" pixie-lab --help >/dev/null
          uvx --from "$WHL" pixie --help >/dev/null
          echo "console scripts run from the built wheel: OK"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    # Strictly last: gates on every prior job (test, integration,
    # build-container, build-wheel, build-media, every PXE chain
    # test) succeeding first. PyPI is for life; a version can never
    # be re-uploaded, so we only ship once the whole release
    # pipeline has gone through cleanly.
    needs:
      - test
      - integration
      - build-container
      - build-wheel
      - build-media
      - build-live-env-image
      - test-pxe
      - test-pxe-nbdboot
      - test-pxe-live-env-modes
      - verify-usbboot
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/pixie-lab
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Idempotent on retries -- if the version is already on PyPI
          # (a previous half-failed run uploaded the wheel and a
          # later job is retrying), succeed silently rather than
          # fail.
          skip-existing: true

  publish-container:
    name: Publish container image to ghcr
    # Build + push the appliance image to ghcr.io/<owner>/pixie on a
    # v* tag: ``:<version>`` (the tag minus its leading ``v``) plus
    # ``:latest``. This is the image the compose deploy runs; before
    # this the ``build-container`` job only smoke-built it and threw it
    # away, so ghcr.io/safl/pixie was never populated by CI. Gated on
    # the whole pipeline like publish-pypi -- never ship an image the
    # boot-chain tests did not pass against.
    needs:
      - test
      - integration
      - build-container
      - build-wheel
      - build-media
      - build-live-env-image
      - test-pxe
      - test-pxe-nbdboot
      - test-pxe-live-env-modes
      - verify-usbboot
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/podman-registry-mirror
      - name: Log in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build + push image
        run: |
          set -eu
          IMAGE=ghcr.io/${{ github.repository_owner }}/pixie
          VERSION=${GITHUB_REF_NAME#v}
          podman build \
            --build-arg PIXIE_VERSION="$VERSION" \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:latest" \
            -f Containerfile .
          podman push "$IMAGE:$VERSION"
          podman push "$IMAGE:latest"

  publish-release:
    name: Publish GitHub Release (media assets)
    # Attach the media CI already builds -- the pixie-live-env nbdboot
    # image and the usbboot-pc bootable .iso -- to a GitHub Release on
    # v* tags. Before this they only existed as ephemeral, login-gated
    # workflow artifacts, so an operator had no released live-env or
    # USB image to download. Same
    # full-pipeline gate as the other publish jobs.
    needs:
      - test
      - integration
      - build-container
      - build-wheel
      - build-media
      - build-live-env-image
      - test-pxe
      - test-pxe-nbdboot
      - test-pxe-live-env-modes
      - verify-usbboot
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download media artifacts
        uses: actions/download-artifact@v8
        with:
          # build-media uploads the usbboot-pc .iso under this shape.
          pattern: pixie-*-pc-x86_64
          merge-multiple: true
          path: release-assets
      - name: Download pixie-live-env image
        # The nbdboot live-env image (arch-headless + injected pixie CLI
        # / service): the gzipped disk image + its .sha256, the
        # .content-sha256 sidecar (the value an operator sets
        # PIXIE_LIVE_ENV_IMAGE_SHA to), and the catalog fragment.
        uses: actions/download-artifact@v8
        with:
          name: pixie-live-env-image-x86_64
          path: release-assets
      - name: List release assets
        run: ls -la release-assets
      - name: Stage curated catalog
        # Ship the curated catalog (the nosi subset + the pixie-live-env
        # image) so DEFAULT_CATALOG_URL
        # (.../releases/latest/download/catalog.toml) resolves and
        # pixie's Import + live-env TUI default work.
        run: |
          set -eu
          cp src/pixie/catalog/catalog.toml release-assets/catalog.toml
          ls -la release-assets
      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          # Fail loud if the glob matched nothing -- a release with no
          # media is the bug this job exists to prevent.
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Distribution

            - Container image: `ghcr.io/${{ github.repository_owner }}/pixie:latest` and the matching version tag (this tag without the leading `v`).
            - Python CLI: `uv tool install pixie-lab` (or `pip install pixie-lab`).

            ## Media assets attached here

            - `pixie-live-env-x86_64.img.gz` — the **nbdboot** live-env image: the nosi `arch-headless` base disk image with the pixie CLI + `pixie-on-tty1` service injected. Fetch it from the **Catalog** tab (it seeds into a fresh catalog), then set `PIXIE_LIVE_ENV_IMAGE_SHA` to select it for the `pixie-flash-once` / `pixie-flash-always` / `pixie-inventory` / `pixie-tui` boot modes so they nbdboot this image ephemerally.
            - `pixie-live-env-x86_64.content-sha256` — the raw-image sha256 to set `PIXIE_LIVE_ENV_IMAGE_SHA` to (identical to the `content_sha256` pixie assigns after fetching the `pixie-live-env` catalog entry).
            - `pixie-live-env-catalog.toml` — the catalog fragment (the `pixie-live-env` disk image + its arch-headless netboot bundle) with `content_sha256` filled in; the shipped `catalog.toml` also lists these entries.
            - `pixie-usbboot-pc-x86_64-*.iso` — bootable USB / ISO media for ad-hoc flash-install of images (uncompressed; `dd` / Etcher / Ventoy ready).
            - `*.sha256` — checksums for the above.
