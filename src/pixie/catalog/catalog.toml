# pixie-live-env -- pixie's OWN image (not a nosi subset entry): the
# nosi arch-headless base with the pixie CLI + pixie-on-tty1 service
# injected. This is what the live-env boot modes (pixie-flash-once /
# -always / pixie-inventory / pixie-tui) nbdboot ephemerally. Fetch it
# from the Catalog tab, then set PIXIE_LIVE_ENV_IMAGE_SHA to the
# content_sha256 pixie assigns after the fetch (the same sha the build
# pipeline publishes as the pixie-live-env-x86_64.content-sha256 release
# sidecar). Its netboot_src is arch-headless's own bundle: the transform
# only touches userspace, so the kernel/initrd are reused unchanged.
[[images]]
name = "pixie-live-env"
src = "https://github.com/safl/pixie/releases/latest/download/pixie-live-env-x86_64.img.gz"
format = "img.gz"
arch = "x86_64"
description = "pixie live-env (nosi arch-headless + the pixie CLI + pixie-on-tty1 service). nbdbooted ephemerally for the live-env boot modes; set PIXIE_LIVE_ENV_IMAGE_SHA to its content_sha256."
netboot_src = "oras://ghcr.io/safl/nosi/arch-headless-netboot:latest"

[[images]]
name = "nosi arch-headless netboot bundle"
src = "oras://ghcr.io/safl/nosi/arch-headless-netboot:latest"
format = "tar.gz"
arch = "x86_64"
description = "Netboot bundle for arch-headless: vmlinuz + initrd so pixie can nbdboot the pixie-live-env image over NBD."

# Additional nosi flashable images. arch-headless reuses the netboot
# bundle above, so it nbdboots too; freebsd-14/15 are image-only (nosi
# publishes no netboot bundle for them) -- flash them to a target disk
# with the pixie-flash-* modes; they cannot nbdboot. For the full nosi
# set (desktop / proxmox / rpios / weekly-pinned tags) use "Fetch latest
# catalog" on the Catalog page.
[[images]]
name = "nosi arch-headless"
src = "oras://ghcr.io/safl/nosi/arch-headless:latest"
format = "img.gz"
arch = "x86_64"
description = "Arch Linux headless (rolling) -- the lean nosi netboot base (no dev toolchain). nbdboot-capable via the arch-headless netboot bundle."
netboot_src = "oras://ghcr.io/safl/nosi/arch-headless-netboot:latest"

[[images]]
name = "nosi freebsd-14-headless"
src = "oras://ghcr.io/safl/nosi/freebsd-14-headless:latest"
format = "img.gz"
arch = "x86_64"
description = "FreeBSD 14 headless. Flash-only (nosi ships no netboot bundle): write it to a target disk with the pixie-flash-* modes."

[[images]]
name = "nosi freebsd-15-headless"
src = "oras://ghcr.io/safl/nosi/freebsd-15-headless:latest"
format = "img.gz"
arch = "x86_64"
description = "FreeBSD 15 headless. Flash-only (nosi ships no netboot bundle): write it to a target disk with the pixie-flash-* modes."
