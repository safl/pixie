# pixie USB live appliance - build configuration
#
# Drives ``mkarchiso`` (via cijoe/scripts/archiso_build.py) to produce a
# hybrid ISO from the ``pixie-media/archiso`` profile that boots from CD
# media, a USB stick (BIOS + UEFI), and BMC virtual media. The ISO ships
# uncompressed (~1.3 GiB with full linux-firmware): PIXIE_IMGS is just
# 32 MiB at bake time (auto-grows to fill the stick on first boot via
# ``pixie-usb-grow.service``), so the artifact stays under GitHub's 2 GiB
# per-release-asset limit without compression.
#
# Operators on a GUI flasher (Etcher / RPi Imager / Rufus DD-mode)
# open the .iso directly -- no decompress step. CLI:
#
#     dd if=pixie-usbboot-pc-x86_64.iso of=/dev/sdX bs=4M
#
# Ventoy users: drop the .iso onto the Ventoy data partition.
#
# Usage:
#   cijoe tasks/usbboot-pc.yaml --config configs/usbboot-pc.toml --monitor
# (or via the Makefile dispatcher: ``make build VARIANT=usbboot-pc``)

[pixie]
variant = "usbboot-pc"

[cijoe.workflow]
fail_fast = true

# Where the published artifact lands. Mirrors the netboot-pc
# variant's default so all images live under one tree.
[system-imaging.images.pixie-usbboot-pc-x86_64-iso]
publish.dir = "{{ local.env.HOME }}/system_imaging/disk"
