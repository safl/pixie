doc: |
  pixie USB live env build (archiso iso-hybrid)
  =============================================

  Builds a hybrid ISO via ``mkarchiso`` from the ``pixie-media/archiso``
  profile -- an Arch Linux live image trimmed to the flash / inventory
  tooling. The output is a stock bootable ISO (BIOS + UEFI) that
  operators write to a USB stick (``dd``, Balena Etcher, Rufus), drop
  onto a Ventoy stick, or mount via BMC virtual media (Redfish / PiKVM /
  JetKVM). Replaces the retired Debian live-build pipeline: the Arch
  kernel + full linux-firmware carry the NIC drivers in-tree, so the
  r8125 DKMS stack is gone.

  The airootfs carries the pixie runtime (a vendored CLI under
  ``/opt/pixie/lib`` staged at build time) and ``pixie-on-tty1.service``
  (the merged dispatcher: GETs ``<server>/pxe/<mac>/plan`` and runs
  auto-flash / interactive wizard / no-op). The pre-built artifact ships
  a writable ``PIXIE_IMGS`` exFAT partition that
  ``var-lib-pixie-images.mount`` attaches at ``/var/lib/pixie/images``.
  When booted from USB with no ``pixie.server`` / ``pixie.mac`` on the
  kernel cmdline, ``pixie`` runs flagless and finds the operator's
  catalog there; when chained from a pixie server's iPXE script, the
  same unit drives the network-flash path through the plan endpoint.

  Steps:

  1. ``archiso_build`` - copies ``pixie-media/archiso`` into a working
     dir, vendors the pixie-lab CLI into its airootfs, stamps the
     version, runs ``mkarchiso`` inside a privileged archlinux container
     (podman or docker), then appends the trailing PIXIE_IMGS exFAT
     partition and publishes ``pixie-usbboot-pc-x86_64-v<version>.iso``
     (+ sha256) under ``publish.dir``. Uncompressed: every flasher
     (dd / Etcher / Rufus / Ventoy) reads it directly.

  Requires: a container runtime able to run ``--privileged
  --network=host`` (podman on the lab / dev host, docker on CI),
  passwordless sudo (the exFAT append uses losetup + mkfs.exfat), ``uv``
  on PATH, and ``exfatprogs`` on the host.

steps:
- name: archiso_build
  uses: archiso_build
